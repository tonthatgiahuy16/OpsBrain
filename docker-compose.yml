services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opsbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsbrain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsbrain_password}
      POSTGRES_DB: ${POSTGRES_DB:-opsbrain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opsbrain_pgdata:/var/lib/postgresql/data
      - ./migrations/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsbrain_user} -d ${POSTGRES_DB:-opsbrain}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opsbrain-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsbrain-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      POSTGRES_USER: ${POSTGRES_USER:-opsbrain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsbrain_password}
      POSTGRES_DB: ${POSTGRES_DB:-opsbrain}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://opsbrain_user:opsbrain_password@db:5432/opsbrain}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:7b}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - opsbrain-network

volumes:
  opsbrain_pgdata:
    driver: local

networks:
  opsbrain-network:
    driver: bridge
