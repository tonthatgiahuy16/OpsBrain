name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsbrain_owner
          POSTGRES_PASSWORD: opsbrain_owner_password
          POSTGRES_DB: opsbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opsbrain_owner -d opsbrain_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://opsbrain_app:opsbrain_app_password@127.0.0.1:5432/opsbrain_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://opsbrain_owner:opsbrain_owner_password@127.0.0.1:5432/opsbrain_test
      OPSBRAIN_CONCURRENCY_DATABASE_URL: postgresql+asyncpg://opsbrain_owner:opsbrain_owner_password@127.0.0.1:5432/opsbrain_concurrency_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bootstrap test databases, roles, and pgvector
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: opsbrain_owner_password
          POSTGRES_USER: opsbrain_owner
          OPSBRAIN_APP_USER: opsbrain_app
          OPSBRAIN_APP_PASSWORD: opsbrain_app_password
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h 127.0.0.1 -U opsbrain_owner -d opsbrain_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE opsbrain_concurrency_test;"
          for db in opsbrain_test opsbrain_concurrency_test; do
            POSTGRES_DB="$db" bash migrations/init_roles.sh
            psql -h 127.0.0.1 -U opsbrain_owner -d "$db" -v ON_ERROR_STOP=1 -f migrations/init_pgvector.sql
          done

      - name: Run migrations and schema check
        run: |
          python -m alembic upgrade head
          python -m alembic check
          MIGRATION_DATABASE_URL="postgresql+asyncpg://opsbrain_owner:opsbrain_owner_password@127.0.0.1:5432/opsbrain_concurrency_test" python -m alembic upgrade head

      - name: Run full test suite (including concurrency DB)
        run: python -m pytest -q

      - name: Check PR diff formatting
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Check push diff formatting
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          fi
